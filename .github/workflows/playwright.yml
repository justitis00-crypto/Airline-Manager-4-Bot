name: Playwright Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  router:
    runs-on: ubuntu-22.04
    outputs:
      run_airline: ${{ steps.route.outputs.run_airline }}
    steps:
      - name: Decide scheduled operation
        id: route
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_airline=true" >> "$GITHUB_OUTPUT"
          else
            minute=$(date -u +%M)
            if [ "$minute" = "00" ] || [ "$minute" = "30" ]; then
              echo "run_airline=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled minute $minute: airline operations will run."
            else
              echo "run_airline=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled minute $minute: resource-only run."
            fi
          fi

  resources:
    if: ${{ github.event_name == 'schedule' }}
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
      - name: Disable Man-DB Auto-Update
        run: |
          sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
          sudo dpkg-reconfigure man-db
      - name: Install Playwright Browsers
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx playwright install --with-deps chromium
      - name: Create .env file
        run: |
          touch .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
          echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
      - name: Run Resource Check
        run: npx playwright test tests/resource.spec.ts

  airline:
    needs: router
    if: ${{ needs.router.outputs.run_airline == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
      - name: Disable Man-DB Auto-Update
        run: |
          sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
          sudo dpkg-reconfigure man-db
      - name: Install Playwright Browsers
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx playwright install --with-deps chromium
      - name: Create .env file
        run: |
          touch .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
          echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
          echo "INCREASE_AIRLINE_REPUTATION=${{ vars.INCREASE_AIRLINE_REPUTATION }}" >> .env
          echo "CAMPAIGN_TYPE=${{ vars.CAMPAIGN_TYPE }}" >> .env
          echo "CAMPAIGN_DURATION=${{ vars.CAMPAIGN_DURATION }}" >> .env
      - name: Run Playwright tests
        run: npx playwright test
