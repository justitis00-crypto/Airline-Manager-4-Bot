name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run: full = everything, resources = fuel and CO2 only, pricing = ticket prices, routing = routes for parked planes (see README)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - resources
          - pricing
          - routing
      pricing_mode:
        description: 'Pricing only: inspect = read-only look, dry-run = log planned prices, live = save prices'
        required: false
        default: 'inspect'
        type: choice
        options:
          - inspect
          - dry-run
          - live
      pricing_max_routes:
        description: 'Pricing only: how many routes to process (0 = all)'
        required: false
        default: '3'
      routing_mode:
        description: 'Routing only: inspect = read-only look, dry-run = pick but do not take, live = take the route'
        required: false
        default: 'inspect'
        type: choice
        options:
          - inspect
          - dry-run
          - live
      routing_attempts:
        description: 'Routing only: how many suggested routes to look at per plane'
        required: false
        default: '25'
  # Backup only. GitHub often delays or skips scheduled runs, so the main
  # triggers are external calls to the workflow_dispatch API (see README).
  schedule:
    - cron: "17,47 * * * *"

# Never run two sessions on the same game account at once.
concurrency:
  group: airline-bot
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 45 
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright version
      id: pw-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

    - name: Disable Man-DB Auto-Update
      run: |
        sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
        sudo dpkg-reconfigure man-db

    - name: Install Playwright Browsers
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npx playwright install --with-deps chromium

    - name: Create .env file
      run: |
        touch .env
        echo "EMAIL=${{ secrets.EMAIL }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
        echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
        echo "INCREASE_AIRLINE_REPUTATION=${{ vars.INCREASE_AIRLINE_REPUTATION }}" >> .env
        echo "CAMPAIGN_TYPE=${{ vars.CAMPAIGN_TYPE }}" >> .env
        echo "CAMPAIGN_DURATION=${{ vars.CAMPAIGN_DURATION }}" >> .env
        echo "PRICING_MODE=${{ inputs.pricing_mode || 'inspect' }}" >> .env
        echo "PRICING_MAX_ROUTES=${{ inputs.pricing_max_routes || '3' }}" >> .env
        echo "PRICING_GAME_MODE=${{ vars.PRICING_GAME_MODE }}" >> .env
        echo "PRICE_MULT_Y=${{ vars.PRICE_MULT_Y }}" >> .env
        echo "PRICE_MULT_J=${{ vars.PRICE_MULT_J }}" >> .env
        echo "PRICE_MULT_F=${{ vars.PRICE_MULT_F }}" >> .env
        echo "PRICE_MARGIN=${{ vars.PRICE_MARGIN }}" >> .env
        echo "ROUTING_MODE=${{ inputs.routing_mode || 'inspect' }}" >> .env
        echo "ROUTING_ATTEMPTS=${{ inputs.routing_attempts || '25' }}" >> .env
        echo "ROUTING_MIN_ECONOMY=${{ vars.ROUTING_MIN_ECONOMY }}" >> .env

    - name: Run Playwright tests
      env:
        TASK: ${{ inputs.task || 'full' }}
      run: |
        if [ "$TASK" = "resources" ]; then
          npx playwright test tests/resource.spec.ts
        elif [ "$TASK" = "pricing" ]; then
          npx playwright test tests/pricing.spec.ts
        elif [ "$TASK" = "routing" ]; then
          npx playwright test tests/routing.spec.ts
        else
          npx playwright test tests/airlineManager.spec.ts
        fi
