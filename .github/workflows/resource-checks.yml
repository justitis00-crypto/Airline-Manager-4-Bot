name: Resource Checks

on:
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Resource to check manually'
        required: true
        type: choice
        options:
          - fuel
          - co2

concurrency:
  group: resource-checks
  cancel-in-progress: false

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    env:
      CHECK_TYPE: ${{ inputs.check_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
      - name: Disable Man-DB Auto-Update
        run: |
          sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
          sudo dpkg-reconfigure man-db
      - name: Install Playwright Browsers
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx playwright install --with-deps chromium
      - name: Create .env file
        run: |
          touch .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
          echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
      - name: Run Resource Check
        run: npx playwright test tests/resource.spec.ts
